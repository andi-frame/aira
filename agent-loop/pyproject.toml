[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aira-agent-loop"
version = "0.1.0"
description = "AIRA Universal Eyes-Free Voice Agent Loop powered by LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=1.6.2",
    "langgraph>=0.2.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/aira_agent"]

